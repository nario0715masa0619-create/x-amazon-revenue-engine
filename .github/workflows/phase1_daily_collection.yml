name: Phase 1 X収集 → Phase 2分類（日次）

# GOV-20260901-DAILY-PIPELINE-01: Phase 1収集(x_api_phase1_collect.py)→
# 累積ストア追記(accumulate_phase1_collection.py)→Phase 2分類
# (x_api_phase2_classify.py)を日次で自動実行する。
#
# GOV-20260902-DEEPDIVE-AUTO-REGISTER-WIRING-01: Phase 2分類の直後に
# register_watched_accounts.pyを追加（同一job・同一runner内で連続実行する
# ことで、.gitignore対象のoutputs/x_api_phase2/pre_teacher_candidate.jsonが
# ジョブをまたがず参照できることを利用。ワークフロー構造自体は変えていない）。
# これにより、深掘り収集（phase1_deepdive_collection.yml）の監視対象アカウント
# 登録・graduatedからの自動復帰が実際に起動するようになった。人間の明示的な
# 承認により「既存の日次ワークフロー本体は変更しない」制約を今回に限り解除した。
#
# GOV-20260902-TEACHER-THEME-AUTOEXTRACT-01: register_watched_accounts.pyの直後に
# extract_topic_groups_from_teachers.pyを追加。同じ理由（outputs/x_api_phase2/
# pre_teacher_candidate.jsonが本文を含む・ジョブをまたいで永続化されないため、
# 同一job内で本文がまだ存在するうちに実行する必要がある）で同一jobへ配線した。
# 抽出結果は"proposed"状態でのみ登録され、人間がpromote_proposed_topic_group()で
# 昇格させるまでmainlineの候補生成には一切現れない
# （既存のpasses_mainline_candidate_filter()は無変更のまま）。
#
# 触れていない領域: Gate A / thresholds / shipping decision、
# _apply_engagement_gate()本体、_classify_core()本体、topic_groupの既存
# ライフサイクル関数（record_mainline_attempt等）・候補フィルタ本体、
# Phase 1クエリ内容（QUERIES定数、Q1-Q6）、
# Phase 1収集・Phase 2分類ステップ自体のコマンド内容（無変更）。

on:
  schedule:
    # 毎日UTC 21:00（JST翌06:00相当）に1回実行。暫定値であり、
    # 運用実態に応じて変更可能（cron式のみ書き換えればよい）。
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect-and-classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Phase 1 X API収集
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/x_api_phase1_collect.py

      - name: 累積ストアへ追記（post_id基準の重複除外、本文は保存しない）
        run: python scripts/accumulate_phase1_collection.py

      - name: Phase 2 分類
        run: python scripts/x_api_phase2_classify.py

      - name: 深掘り監視対象アカウントの自動登録（pre_teacher_candidateの投稿者、読み取り専用後段ステップ）
        run: python scripts/register_watched_accounts.py

      - name: teacher投稿からのtopic_group自動抽出（"proposed"状態、読み取り専用後段ステップ）
        run: python scripts/extract_topic_groups_from_teachers.py

      - name: 累積ストア・監視対象アカウント状態・topic_group状態の変更をcommit・push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # watched_accounts.jsonlは新規登録が1件も無い実行では作成されない
          # （追記専用ログのため）。存在しないpathspecを渡すとgit add自体が
          # 失敗する（他の存在するファイルも道連れでcommitされなくなる）ため、
          # 実際に存在するファイルのみを対象に加える。
          for f in ops/data/x_api_phase1_cumulative.jsonl ops/data/watched_accounts.jsonl ops/data/watched_account_state.json ops/reports/topic_group_state_2026-08-31.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --cached --quiet; then
            echo "変更なし（新規post_id・新規登録対象・新規proposed topic_groupが無かった）。commitをスキップします。"
          else
            git commit -m "chore: Phase 1収集累積ストア・監視対象アカウント状態・topic_group状態を更新（自動実行、$(date -u +%Y-%m-%d)）"
            git push
          fi
